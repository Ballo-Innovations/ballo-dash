services:
  db: { image: postgres:16-alpine, environment: { POSTGRES_USER: lens, POSTGRES_PASSWORD: lens, POSTGRES_DB: lens }, ports: ["5432:5432"], volumes: [pgdata:/var/lib/postgresql/data], healthcheck: { test: ["CMD-SHELL","pg_isready -U lens"], interval: 5s, retries: 10 } }
  minio: { image: minio/minio:latest, command: server /data --console-address ":9001", environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio12345 }, ports: ["9000:9000","9001:9001"], volumes: [minio:/data] }
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    depends_on: { db: { condition: service_healthy } }
    env_file: .env
    environment: { DATABASE_URL: postgresql://lens:lens@db:5432/lens, S3_ENDPOINT: http://minio:9000 }
    ports: ["3000:3000"]
    command: sh -c "pnpm prisma migrate deploy && pnpm db:seed && pnpm start"
  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    depends_on: { db: { condition: service_healthy } }
    env_file: .env
    environment: { DATABASE_URL: postgresql://lens:lens@db:5432/lens, SIM_SCENARIO: baseline, SIM_RATE_PER_MIN: "6" }
volumes: { pgdata: {}, minio: {} }
